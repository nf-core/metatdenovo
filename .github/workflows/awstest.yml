name: nf-core AWS test
# This workflow can be triggered manually with the GitHub actions workflow dispatch button.
# It runs the -profile 'test' on AWS batch

on:
  workflow_dispatch:
jobs:
  run-platform:
    name: Run AWS tests
    if: github.repository == 'nf-core/metatdenovo'
    runs-on: ubuntu-latest
    steps:
      - name: Launch workflow via Seqera Platform
        uses: seqeralabs/action-seqera-launch@v1
        with:
          wait: running
          syntax-parser: v2
          workspace-id: ${{ vars.TOWER_WORKSPACE_ID }}
          access-token: ${{ secrets.TOWER_ACCESS_TOKEN }}
          compute-env: ${{ vars.TOWER_COMPUTE_ENV }}
          revision: ${{ github.sha }}
          work-dir: s3://${{ vars.AWS_S3_BUCKET }}/work/metatdenovo/work-${{ github.sha }}
          parameters: |
            {
              "outdir": "s3://${{ vars.AWS_S3_BUCKET }}/metatdenovo/results-test-${{ github.sha }}"
            }
          profiles: test
