# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "metaeuk"
description: Calls ORFs on assembled contigs with MetaEuk (splice-aware, eukaryote-targeted)
  and reformats its GFF output for featureCounts
keywords:
  - metaeuk
  - orf
  - eukaryotes
  - gene prediction
components:
  - metaeuk/easypredict
  - format/metaeuk/gff
input:
  - fasta:
      type: file
      description: |
        Channel containing metadata and an assembly fasta file
        Structure: [ val(meta), path(fasta) ]
      pattern: "*.{fa,fasta,fa.gz,fasta.gz}"
  - database:
      type: file
      description: |
        Either a protein fasta file, or a directory containing an
        mmseqs2-formatted protein database, used as the MetaEuk homology
        reference
        Structure: path(database)
output:
  - faa:
      type: file
      description: |
        Protein FASTA file containing the predicted ORFs
        Structure: [ val(meta), path(faa) ]
      pattern: "*.fas"
  - gff:
      type: file
      description: |
        CDS-only GFF file with one shared ID per (possibly multi-exon) gene,
        suitable for featureCounts
        Structure: [ val(meta), path(gff) ]
      pattern: "*_format.gff.gz"
  - versions:
      type: file
      description: |
        File containing software versions
        Structure: [ path(versions.yml) ]
      pattern: "versions.yml"
authors:
  - "@erikrikarddaniel"
maintainers:
  - "@erikrikarddaniel"
