name: interproscan_annotation
description: Runs InterProScan functional annotation on called ORFs and summarizes the results
keywords:
  - interproscan
  - functional annotation
  - protein sequences
components:
  - interproscan/database
  - interproscan/stripasterisk
  - interproscan
  - interproscan/format
  - interproscan/sum
input:
  - faa:
      type: file
      description: Protein sequences in FASTA format
      pattern: "*.{faa,fasta}"
  - collect_fcs:
      type: file
      description: Feature count files
      pattern: "*.counts.tsv.gz"
output:
  - annotation:
      type: file
      description: Reformatted InterProScan annotation TSV output file
      pattern: "*.interproscan.tsv.gz"
  - sumtable:
      type: file
      description: Summarized InterProScan annotation results
      pattern: "*.interproscan_summary.tsv.gz"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@danilodileo"
