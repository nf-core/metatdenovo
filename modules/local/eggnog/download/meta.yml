name: "eggnog_download"
description: Downloads EggNOG database files for functional annotation
keywords:
  - eggnog
  - download
  - database
  - functional annotation
input: none
output:
  eggnog_data_dir:
    type: directory
    description: Directory containing eggnog.db, eggnog.taxa.db and eggnog.taxa.db.traverse.pkl (the --data_dir for emapper.py)
    pattern: "eggnog_data"
  dmnd:
    type: file
    description: DIAMOND-formatted EggNOG protein database
    pattern: "eggnog_proteins.dmnd"
  all:
    type: directory
    description: Directory containing all downloaded EggNOG files
    pattern: "*"
  versions_emapper:
    - - "${task.process}":
          type: string
          description: The name of the process
      - eggnog-mapper:
          type: string
          description: The name of the tool
      - emapper.py --version | sed "s/.* emapper-//" | sed "s/ \\/ Expected.*//":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - eggnog-mapper:
          type: string
          description: The name of the tool
      - emapper.py --version | sed "s/.* emapper-//" | sed "s/ \\/ Expected.*//":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@danilodileo"
