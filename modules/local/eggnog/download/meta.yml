name: "eggnog_download"
description: Downloads EggNOG database files for functional annotation
keywords:
  - eggnog
  - download
  - database
  - functional annotation
input:
  - eggnog_db_gz:
      type: file
      description: Gzipped EggNOG database file, staged from a URL via Nextflow's own file() so it works on network-isolated compute nodes
  - eggnog_dmnd_gz:
      type: file
      description: Gzipped DIAMOND-formatted EggNOG protein database, staged from a URL via Nextflow's own file()
  - eggnog_taxa_targz:
      type: file
      description: Gzipped tar archive of the EggNOG taxonomy database, staged from a URL via Nextflow's own file()
output:
  eggnog_db:
    type: file
    description: EggNOG database file
    pattern: "eggnog.db"
  dmnd:
    type: file
    description: DIAMOND-formatted EggNOG protein database
    pattern: "eggnog_proteins.dmnd"
  taxa_db:
    type: file
    description: EggNOG taxonomy database
    pattern: "eggnog.taxa.db"
  pkl:
    type: file
    description: EggNOG taxonomy traverse pickle file
    pattern: "eggnog.taxa.db.traverse.pkl"
  all:
    type: directory
    description: Directory containing all downloaded EggNOG files
    pattern: "*"
  versions_emapper:
    - - "${task.process}":
          type: string
          description: The name of the process
      - eggnog-mapper:
          type: string
          description: The name of the tool
      - emapper.py --version | sed "s/.* emapper-//" | sed "s/ \\/ Expected.*//":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - eggnog-mapper:
          type: string
          description: The name of the tool
      - emapper.py --version | sed "s/.* emapper-//" | sed "s/ \\/ Expected.*//":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@danilodileo"
