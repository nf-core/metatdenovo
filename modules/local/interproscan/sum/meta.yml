name: "interproscan_sum"
description: Summarizes InterProScan annotation results and combines with feature counts
keywords:
  - interproscan
  - summary
input:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - interproscan:
      type: file
      description: Reformatted InterProScan annotation table
      pattern: "*.interproscan.tsv.gz"
  - fcs:
      type: file
      description: Feature counts files
      pattern: "*.counts.tsv.gz"
output:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - interproscan_summary:
      type: file
      description: Summarized InterProScan annotation results
      pattern: "*.interproscan_summary.tsv.gz"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@danilodileo"
maintainers:
  - "@danilodileo"
