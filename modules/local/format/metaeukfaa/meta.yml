name: "format_metaeukfaa"
description: Rewrites MetaEuk protein FASTA sequence ids to match the ID attribute
  FORMAT_METAEUK_GFF derives from the GFF, so ORF-keyed joins between counts tables
  and annotation tables work
keywords:
  - metaeuk
  - fasta
  - format
  - gene prediction
input:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - faa:
      type: file
      description: MetaEuk protein FASTA output file
      pattern: "*.{fas,faa}{.gz,}"
output:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - format_faa:
      type: file
      description: Protein FASTA whose sequence ids are target|contig|strand|lowCoord,
        identical to the GFF ID attribute for the same gene
      pattern: "*_format.faa.gz"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@erikrikarddaniel"
maintainers:
  - "@erikrikarddaniel"
