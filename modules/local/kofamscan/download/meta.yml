name: "kofamscan_download"
description: Downloads KEGG Orthology (KO) data for KofamScan
keywords:
  - kofamscan
  - kegg
  - orthology
  - download
input:
  - ko_list_gz:
      type: file
      description: Gzipped KOfam ko_list file, staged from a URL via Nextflow's own file() so it works on network-isolated compute nodes
  - profiles_targz:
      type: file
      description: Gzipped tar archive of KOfam HMM profiles, staged from a URL via Nextflow's own file()
output:
  ko_list:
    type: file
    description: KEGG Orthology (KO) list file
    pattern: "ko_list"
  koprofiles:
    type: directory
    description: Directory containing KEGG Orthology profiles
    pattern: "profiles"
  versions_kofamscan:
    - - "${task.process}":
          type: string
          description: The name of the process
      - gzip:
          type: string
          description: The name of the tool
      - gzip --version | head -n 1 | awk "{print \$2}":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - gzip:
          type: string
          description: The name of the tool
      - gzip --version | head -n 1 | awk "{print \$2}":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@danilodileo"
