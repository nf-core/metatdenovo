# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "dbcan_format"
description: Reformat dbCAN's CAZyme annotation overview table into a summary-table-ready TSV
keywords:
  - dbcan
  - cazyme
  - format
tools:
  - "gzip":
      description: Compression utility
      homepage: https://www.gnu.org/software/gzip/
      documentation: https://www.gnu.org/software/gzip/manual/gzip.html
      licence: ["GPL-3.0-or-later"]
      identifier: null

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - overview:
        type: file
        description: dbCAN CAZyme annotation overview table
        pattern: "*_overview.tsv"

output:
  dbcantsv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.dbcan.tsv.gz":
          type: file
          description: Reformatted dbCAN CAZyme annotation for summary tables
          pattern: "*.dbcan.tsv.gz"
  versions_gzip:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "gzip":
          type: string
          description: The name of the tool
      - "gzip --version":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gzip:
          type: string
          description: The name of the tool
      - gzip --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@erikrikarddaniel"
maintainers:
  - "@erikrikarddaniel"
